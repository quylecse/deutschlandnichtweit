name: Keep Backend & Supabase Alive

on:
  # Chạy mỗi 14 phút để giữ Render Free Tier không bị sleep sau 15 phút
  # và giữ Supabase Free Tier không bị pause do không có truy vấn
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Render Backend & Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health & Database
        env:
          BACKEND_URL: ${{ secrets.PRODUCTION_BACKEND_URL || 'https://deutschlandnichtweit.onrender.com' }}
        run: |
          echo "Pinging ${BACKEND_URL}/health ..."
          curl -fsSL --retry 3 --retry-delay 5 --max-time 60 "${BACKEND_URL%/}/health"
          echo ""
          echo "Pinging ${BACKEND_URL}/api/studienkollegs to keep Supabase active..."
          curl -fsSL --retry 2 --retry-delay 5 --max-time 60 "${BACKEND_URL%/}/api/studienkollegs" > /dev/null
          echo "Keep-alive ping succeeded!"

