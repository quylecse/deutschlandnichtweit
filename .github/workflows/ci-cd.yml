name: CI/CD & Scheduled Crawler Sync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Tự động chạy crawler cập nhật dữ liệu mỗi thứ Hai lúc 03:00 sáng (UTC)
  schedule:
    - cron: '0 3 * * 1'
  # Cho phép bấm chạy thủ công trên tab Actions của GitHub
  workflow_dispatch:

jobs:
  # 1. Kiểm tra TypeScript & Build cho cả Backend và Frontend
  ci-build:
    name: Build & Typecheck (Backend + Frontend)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install & Build Backend
        working-directory: ./backend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install & Typecheck Frontend
        working-directory: ./frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit

  # 2. Cronjob tự động gọi API đồng bộ dữ liệu Studienkolleg định kỳ
  scheduled-crawler-sync:
    name: Sync Studienkolleg Data (Weekly Cron)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger Backend Crawler Sync
        env:
          BACKEND_URL: ${{ secrets.PRODUCTION_BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "Chưa cấu hình secret PRODUCTION_BACKEND_URL trong GitHub Settings."
            exit 0
          fi
          curl -f -X POST "${BACKEND_URL%/}/api/crawler/sync"

