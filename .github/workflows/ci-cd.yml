name: CI/CD & Scheduled Crawler Sync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Tự động chạy crawler cập nhật dữ liệu mỗi thứ Hai lúc 03:00 sáng (UTC)
  schedule:
    - cron: '0 3 * * 1'
  # Cho phép bấm chạy thủ công trên tab Actions của GitHub
  workflow_dispatch:
    inputs:
      action:
        description: 'Chọn tác vụ muốn chạy'
        type: choice
        default: 'migrate_db'
        options:
          - migrate_db
          - sync_crawler
      target_env:
        description: 'Môi trường database (khi chọn migrate_db)'
        type: choice
        default: 'production'
        options:
          - production
          - staging

jobs:
  # 1. Kiểm tra TypeScript & Build cho cả Backend và Frontend
  ci-build:
    name: Build & Typecheck (Backend + Frontend)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.action == 'migrate_db')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install & Build Backend
        working-directory: ./backend
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Install & Typecheck Frontend
        working-directory: ./frontend
        run: |
          pnpm install --no-frozen-lockfile
          pnpm exec next typegen
          pnpm exec tsc --noEmit

  # 2. Chạy Database Migration lên Supabase (Chỉ chạy khi bạn chủ động bấm nút trên GitHub Actions)
  supabase-migrate:
    name: Migrate Supabase DB
    runs-on: ubuntu-latest
    needs: ci-build
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'migrate_db'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link & Push Migrations to Supabase
        working-directory: ./backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROD_SUPABASE_PROJECT_ID: ${{ secrets.PROD_SUPABASE_PROJECT_ID }}
          PROD_SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
        run: |
          # 1. Lựa chọn project id và password theo môi trường được chọn khi bấm nút
          if [ "${{ inputs.target_env }}" = "production" ] && [ -n "$PROD_SUPABASE_PROJECT_ID" ]; then
            echo "🚀 Đang chuẩn bị migration lên môi trường: PRODUCTION"
            TARGET_PROJECT_ID="$PROD_SUPABASE_PROJECT_ID"
            TARGET_DB_PASSWORD="$PROD_SUPABASE_DB_PASSWORD"
          else
            echo "🛠️ Đang chuẩn bị migration lên môi trường: ${{ inputs.target_env }}"
            TARGET_PROJECT_ID="$SUPABASE_PROJECT_ID"
            TARGET_DB_PASSWORD="$SUPABASE_DB_PASSWORD"
          fi

          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$TARGET_PROJECT_ID" ] || [ -z "$TARGET_DB_PASSWORD" ]; then
            echo "❌ Thiếu GitHub Secrets cần thiết để kết nối Supabase. Vui lòng kiểm tra lại cấu hình."
            exit 1
          fi

          # 2. Link tới project Supabase
          supabase link --project-ref "$TARGET_PROJECT_ID"

          # 3. Đẩy toàn bộ migration mới lên Remote Database
          supabase db push --remote --password "$TARGET_DB_PASSWORD" --include-all

  # 3. Cronjob tự động gọi API đồng bộ dữ liệu Studienkolleg định kỳ
  scheduled-crawler-sync:
    name: Sync Studienkolleg Data (Weekly Cron)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'sync_crawler')
    steps:
      - name: Trigger Backend Crawler Sync
        env:
          SECRET_BACKEND_URL: ${{ secrets.PRODUCTION_BACKEND_URL }}
        run: |
          BASE_URL="${SECRET_BACKEND_URL:-https://deutschlandnichtweit.onrender.com}"
          BASE_URL="${BASE_URL%/}"
          BASE_URL="${BASE_URL%/api}"
          curl -f -X POST "${BASE_URL}/api/crawler/sync"
